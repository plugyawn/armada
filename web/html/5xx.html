<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Internal server error | Armada</title>
        <meta http-equiv="refresh" content="60;URL='/'" />
        <link rel="icon" href="/static/images/armada-favicon.svg" />
        <!-- Drawn by the armada-portico webpack assets, as templates/500.html is. -->
    </head>
    <body>
        <div class="armada-kit armada-portico" data-plane="content">
            <div class="armada-portico-top">
                <span class="armada-portico-product">Armada</span>
            </div>
            <main class="armada-portico-main">
                <!-- Keep in sync with templates/500.html -->
                <div class="armada-portico-head">
                    <h1 class="armada-portico-title">Internal server error</h1>
                </div>
                <div class="armada-portico-prose">
                    <p>
                        Something went wrong. Sorry about that! Armada will load automatically once
                        it is working again.
                    </p>
                    <p>
                        If you administer this server, see the
                        <a href="https://zulip.readthedocs.io/en/stable/production/troubleshooting.html">troubleshooting guide</a>.
                    </p>
                </div>
            </main>
        </div>
    </body>
