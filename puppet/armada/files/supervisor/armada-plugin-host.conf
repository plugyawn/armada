; The plugin host (zerver/lib/armada_plugin_host.py): it runs each installed
; plugin's process from ARMADA_PLUGIN_DIR, as the zulip user. It stops its
; plugins when it is stopped; restart-server restarts it on every deploy.
[program:zulip-armada-plugin-host]
command=nice -n5 /home/zulip/deployments/current/manage.py armada_plugin_host --skip-checks
environment=PYTHONUNBUFFERED=1
priority=400                   ; after Django, Tornado and the queue workers
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30                ; it stops each plugin, five seconds at most
user=zulip
redirect_stderr=true
stdout_logfile=/var/log/zulip/armada-plugin-host.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
directory=/home/zulip/deployments/current/
