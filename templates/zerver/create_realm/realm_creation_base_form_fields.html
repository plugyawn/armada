<div class="armada-portico-field">
    <label class="armada-portico-label" for="realm_type">{{ _('Organization type') }}</label>
    <div class="armada-portico-choice">
        <select class="armada-portico-entry" name="realm_type" id="realm_type" required>
            <option disabled selected value>{{ _("Select one") }}</option>
            {% for realm_type in sorted_realm_types %}
            {% if not realm_type.hidden %}
            <option value="{{ realm_type.id }}" {% if form.realm_type.value() == realm_type.id %}selected{% endif %}>{{ _(realm_type.name) }}</option>
            {% endif %}
            {% endfor %}
        </select>
        <svg class="armada-glyph" aria-hidden="true"><use href="#armada-glyph-down" /></svg>
    </div>
</div>

<div class="armada-portico-field">
    <label class="armada-portico-label" for="realm_default_language">{{ _('Organization language') }}</label>
    <div class="armada-portico-choice">
        <select class="armada-portico-entry" name="realm_default_language" id="realm_default_language">
            {% for language in language_list %}
            <option value="{{ language.code }}" {% if form.realm_default_language.value() == language.code %}selected{% endif %}>{{ _(language.name) }}</option>
            {% endfor %}
        </select>
        <svg class="armada-glyph" aria-hidden="true"><use href="#armada-glyph-down" /></svg>
    </div>
</div>
