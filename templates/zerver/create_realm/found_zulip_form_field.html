{# The detail a choice asks for is shown by portico.css when it is chosen. #}
<div class="armada-portico-field" id="how-realm-creator-found-zulip">
    <label class="armada-portico-label" for="how_realm_creator_found_zulip">{{ _('How did you first hear about Armada?') }}</label>
    <div class="armada-portico-choice">
        <select class="armada-portico-entry" id="how_realm_creator_found_zulip" name="how_realm_creator_found_zulip" required>
            <option value="" selected disabled>{{ _('Select an option') }}</option>
            {% for option_id, option_name in how_realm_creator_found_zulip_options %}
            <option value="{{ option_id }}">{{ option_name }}</option>
            {% endfor %}
        </select>
        <svg class="armada-glyph" aria-hidden="true"><use href="#armada-glyph-down" /></svg>
    </div>
    <input class="armada-portico-entry" data-found-by="other" type="text" placeholder="{{ _('Please describe') }}" name="how_realm_creator_found_zulip_other_text" maxlength="100" aria-label="{{ _('Please describe') }}" />
    <input class="armada-portico-entry" data-found-by="ad" type="text" placeholder="{{ _('Where did you see the ad?') }}" name="how_realm_creator_found_zulip_where_ad" maxlength="100" aria-label="{{ _('Where did you see the ad?') }}" />
    <input class="armada-portico-entry" data-found-by="existing_user" type="text" placeholder="{{ _('Which organization?') }}" name="how_realm_creator_found_zulip_which_organization" maxlength="100" aria-label="{{ _('Which organization?') }}" />
    <input class="armada-portico-entry" data-found-by="review_site" type="text" placeholder="{{ _('Which one?') }}" name="how_realm_creator_found_zulip_review_site" maxlength="100" aria-label="{{ _('Which one?') }}" />
    <input class="armada-portico-entry" data-found-by="ai_chatbot" type="text" placeholder="{{ _('Which one?') }}" name="how_realm_creator_found_zulip_which_ai_chatbot" maxlength="100" aria-label="{{ _('Which one?') }}" />
    {% for error in form.how_realm_creator_found_zulip.errors %}
    <p class="armada-portico-error">{{ error }}</p>
    {% endfor %}
</div>
