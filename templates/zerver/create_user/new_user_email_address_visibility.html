<div class="armada-portico-field" id="new-user-email-address-visibility">
    <label class="armada-portico-label" for="email_address_visibility">{{ _('Who can see your email address') }}</label>
    <div class="armada-portico-choice">
        <select class="armada-portico-entry" name="email_address_visibility" id="email_address_visibility">
            {% for value, name in email_address_visibility_options_dict.items() %}
            <option value="{{ value }}" {% if value == default_email_address_visibility %}selected{% endif %}>{{ name }}</option>
            {% endfor %}
        </select>
        <svg class="armada-glyph" aria-hidden="true"><use href="#armada-glyph-down" /></svg>
    </div>
    <p class="armada-portico-hint">{{ _('You can change this after you join.') }}</p>
</div>
