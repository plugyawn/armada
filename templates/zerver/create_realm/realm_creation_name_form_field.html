<div class="armada-portico-field">
    <label class="armada-portico-label" for="id_team_name">{{ _('Organization name') }}</label>
    <input class="armada-portico-entry" id="id_team_name" type="text" name="realm_name"
      value="{% if form.realm_name.value() %}{{ form.realm_name.value() }}{% endif %}"
      maxlength="{{ MAX_REALM_NAME_LENGTH }}" required {% if not user_registration_form %}autofocus{% endif %}
      {% if form.realm_name.errors %}aria-invalid="true"{% endif %} />
    {% for error in form.realm_name.errors %}
    <p class="armada-portico-error">{{ error }}</p>
    {% endfor %}
</div>
