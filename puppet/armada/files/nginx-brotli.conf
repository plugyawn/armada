# Armada: brotli for text assets (puppet/armada/manifests/nginx_brotli.pp).
# Precompressed .br files, written beside the static assets by the
# pre-deploy hook, are served as they are; other text responses are
# compressed on the fly. JSON is left to gzip, so the API's and the event
# queue's answers pay no extra CPU.
brotli_static on;
brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types
    text/css
    text/plain
    text/xml
    application/javascript
    text/javascript
    application/xml
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject;
