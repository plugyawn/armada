<div class="armada-portico-field">
    <label class="armada-portico-label" for="import_from">{{ _('Import chat history?') }}</label>
    <div class="armada-portico-choice">
        <select class="armada-portico-entry" id="import_from" name="import_from" {% if user_registration_form %}disabled{% endif %}>
            {% for key, choice in import_from_choices %}
            <option value="{{ key }}" {% if key == "none" %}selected{% endif %}>{{ _(choice) }}</option>
            {% endfor %}
        </select>
        <svg class="armada-glyph" aria-hidden="true"><use href="#armada-glyph-down" /></svg>
    </div>
</div>
