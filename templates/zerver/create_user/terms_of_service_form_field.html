{#
A checkbox posts name=value when it is ticked, and nothing when it is
not; `checked` only says how it is drawn.
#}
<div class="armada-portico-field">
    <label class="armada-portico-check" for="id_terms">
        <span class="armada-portico-box"><input id="id_terms" type="checkbox" name="terms" required
          {% if form.terms.value() %}checked="checked"{% endif %} /><svg class="armada-glyph" data-size="12" aria-hidden="true"><use href="#armada-glyph-check" /></svg></span>
        <span>
            {% trans %}I agree to the <a href="{{ root_domain_url }}/policies/terms" target="_blank" rel="noopener noreferrer">Terms of Service</a>.{% endtrans %}
        </span>
    </label>
    {% for error in form.terms.errors %}
    <p class="armada-portico-error">{{ error }}</p>
    {% endfor %}
</div>
